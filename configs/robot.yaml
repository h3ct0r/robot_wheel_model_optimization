# Robot platform specification — THE FROZEN SPEC
#
# Everything downstream depends on this file. Phase 0, step 1 is to fill it in and stop
# changing it. If it changes later, every cached result is invalid.
#
# Units: SI throughout (m, kg, s, N, N·m, rad). No millimetres in this file.
#
# STATUS: PROVISIONAL — the *chassis envelope* is a real requirement (400 x 300 x 200 mm,
# given 2026-08-07); everything else is derived to be self-consistent with it and is NOT
# measured. `frozen` stays false: a campaign run against these numbers is a pipeline test,
# not a result. Every value carries its provenance below.
#
# HISTORY: 2026-08-07 the platform was re-specified from a ~4 kg, 300 x 220 x 120 mm class
# robot on 70 mm wheels to the 10 kg, 400 x 300 x 200 mm four-wheel rover below. Nominal
# wheel load went 14.0 -> 24.5 N, which moved the whole wheel design space; see
# docs/experiments/log.md 2026-08-07 for what that invalidated.
#
# NOTE: nothing in the codebase reads this file yet. `PlatformLimits` in
# src/wheelopt/cad/constraints.py duplicates a subset of it and is what actually
# constrains screening today — but as of this revision the two agree, so the duplication is
# no longer also a contradiction. Wiring the loader is what first-week step 1 really is.

meta:
  name: piperobot-426x231           # the measured pipe robot (configs/pipebot_detailed.stl)
  frozen: false                     # pipeline should refuse to run a campaign while false
  frozen_date: null
  provenance: >
    Chassis footprint and height are a stated platform requirement. Mass, drivetrain
    layout and driving direction were chosen 2026-08-07: 10 kg all-up, four-wheel skid
    steer, 400 mm in the driving direction. Everything below is derived from those four
    facts to be mutually consistent. Motors, battery and inertia are class-typical
    estimates, not measurements.

# =========================================================================================
# MEASURED FROM THE 3D MODEL, 2026-08-11 (configs/pipebot_detailed.stl, units mm, 156k tris;
# the model's own mid-body clearance of 34 mm cross-checks the hand-measured 3 cm):
#   overall               426 x 231 x 187 mm  (length x width x height, wheels included)
#   wheelbase             250 mm     (stated value below: 260 -- close, PENDING adoption)
#   track                 157 mm     (stated value below: 350 -- FICTION, PENDING adoption)
#   existing wheels       r ~22.5 mm, four contact patches confirmed on the floor plane
#   structure at r 26.5 from every axle -- consistent with the MX-64 servo horn (D53), which
#     ROTATES with the wheel and therefore caps nothing; the true wheel-radius ceiling is an
#     APPLICATION question (the circular ~187 mm shell says pipe-fit) the STL cannot answer.
# ADOPTED 2026-08-11 after the user answered the gating questions: no pipe-fit constraint,
# the r-26.5 structure is the servo HORN (rotates, caps nothing), wheel width is free
# outboard, and the 8.5 kg was ready-to-run (~8.0 without wheels). This commit is the
# deliberate cache-invalidating adoption the pending block promised.
# =========================================================================================
chassis:
  mass: 8.0                         # kg, EXCLUDING wheels. MEASURED 2026-08-11 (user):
                                    #   8.5 kg ready-to-run with batteries, motors and the
                                    #   original wheels; ~8.0 without wheels. Conservative
                                    #   estimate by the user's own statement.
  length: 0.426                     # m. MEASURED off the 3D model (STL bbox, cross-checked
  width: 0.231                      #   by the hand-measured clearance). The body is a
  height: 0.157                     #   circular ~187 mm shell; the box is its envelope
                                    #   above the belly line (187 - 30 clearance = 157),
                                    #   which is what the belly-contact geom needs.
  com_offset: [0.0, 0.0, 0.0]       # m, assumed geometric centre until measured
  inertia: [0.0512, 0.1374, 0.1566] # kg·m², uniform-box formula at 8.0 kg on the measured
                                    #   dims (estimate; the real one needs component masses
                                    #   in the 3D model -- 17-hardware-baseline.md)
  ground_clearance_min: 0.030       # m. MEASURED 2026-08-11, twice: by hand (3 cm) and off
                                    #   the STL (34 mm lowest mid-body) -- AT THE ORIGINAL
                                    #   r 22.5 mm WHEELS. Clearance is wheel-dependent:
                                    #   see axle_to_belly below, which is the invariant.
                                    #   Old note: the
                                    #   axles sit near the bottom of the chassis.
  axle_to_belly: 0.0075             # m, belly height ABOVE the axle line: 0.030 clearance
                                    #   minus the 0.0225 original wheel radius. This is the
                                    #   bracket geometry and does not change with the wheel,
                                    #   so real clearance = wheel radius + this -- a bigger
                                    #   wheel buys belly clearance one-for-one, which is
                                    #   most of why wheel radius matters on this robot. The
                                    #   sim treating clearance as a constant 0.030 sank an
                                    #   R 85 wheel's axle 55 mm above its own belly.

drivetrain:
  configuration: skid_steer
  n_driven_wheels: 4                # no caster. A caster is a liability on a step edge,
                                    #   which is the scenario this project exists to study.
  wheelbase: 0.250                  # m. MEASURED off the STL: contact patches at z=104.5
                                    #   and z=354.9 on both sides
  track_width: 0.157                # m. MEASURED off the detailed STL: the ORIGINAL r 22.5
                                    #   wheels' mid-planes, tucked UNDER the shell. A
                                    #   reference value -- candidate wheels (R 40-90) cannot
                                    #   tuck under and mount EXTERNALLY; their track derives
                                    #   from wheel_mount_face below (PlatformSpec.track_for)
  wheel_mount_face: 0.0975          # m. Centreline to the side-plate face an external
                                    #   wheel's inner side seats against. MEASURED off
                                    #   pipebot_simplified.stl 2026-08-11: axle stubs (r 7.5,
                                    #   z 24.5) emerge at x=+97/-98 about midline -0.5 --
                                    #   +/-97.5 exactly. Track = 0.195 + wheel width

motor:
  # MEASURED HARDWARE 2026-08-11: four ROBOTIS Dynamixel MX-64AT at 12 V. Datasheet values
  # at 12 V, quoted AT THE OUTPUT — the 200:1 is the servo's internal gearbox and the
  # datasheet measures through it, so no efficiency factor is applied on top.
  # Verify against the label: 6.0 N·m stall / 63 rev/min no-load / ~4.1 A stall at 12 V.
  # Tractive sanity: 4 x 6.0 / 0.060 m = 400 N of stall tractive force against an ~83 N
  # vehicle — traction-limited long before torque-limited, at any radius in the range.
  brand: dynamixel-mx-64at
  stall_torque: 6.0                 # N·m at the output, 12 V (datasheet)
  no_load_speed: 6.597              # rad/s at the output = 63 rev/min (datasheet).
                                    #   Top speed R60: 0.40 m/s, R85: 0.56 m/s -- half the
                                    #   old estimate's; every duration-sized scenario box
                                    #   shrinks with it automatically (reach = w*R*t)
  gear_ratio: 200.0                 # internal to the MX-64
  gearbox_efficiency: 1.0           # already included in the output-shaft datasheet values
  motor_constant_kt: null           # not needed while torque/speed are output-measured
  winding_resistance: null          # ditto
  torque_safety_factor: 0.7

power:
  battery_voltage: 12.0             # V. MEASURED 2026-08-11: the MX-64AT bus runs at 12 V
                                    #   (the old 22.2 V estimate would exceed the servo's
                                    #   10-14.8 V range).
  battery_capacity: 55.0            # Wh, PLACEHOLDER -- pack unknown; nothing reads this yet

wheel_interface:
  # Fixed geometry the wheel must mate to. NOT optimised. Re-derived 2026-08-11: there is
  # no D-shaft — wheels bolt to the MX-64 servo HORN, a rotating disc measured at r 26.5 mm
  # in the STL (= the HN05 horn's D53). The 8 mm centre hole clears the horn's thrust boss;
  # the bolt pattern comes from the horn datasheet and is not modelled in CAD (a hub POCKET
  # seating a D53 disc is; see the hub_seats_horn screening warning).
  shaft_diameter: 0.008             # m, centre-boss clearance hole (kept as the loader's
                                    #   bore key; matches hub_bore_radius_mm = 4.0)
  hub_bore_depth: 0.030             # m
  mounting: dynamixel-horn
  horn_diameter: 0.053              # m, MEASURED off the STL (r 26.5 at all four axles)
  bolt_circle_diameter: null        # from the HN05 horn drawing, when bolts are modelled

wheel_envelope:
  # Hard geometric limits on any candidate wheel. These now agree with PARAM_BOUNDS in
  # src/wheelopt/cad/params.py and with PlatformLimits — the three-way disagreement that
  # this file used to document is resolved.
  max_radius: 0.090                 # m. RE-DERIVED 2026-08-11: no pipe-fit constraint (user
                                    #   decision), the horn rotates so it caps nothing, and
                                    #   the X1C bed takes more -- so the cap is judgement:
                                    #   at R 90 the body lifts 67 mm and top speed is
                                    #   0.59 m/s, both still sane. Revisit against brackets
                                    #   when the first big wheel is printed.
  min_radius: 0.040                 # m. The floor is the HORN: the hub must seat a D53
                                    #   rotating disc, so hub >= ~0.028, and a bandless claw
                                    #   shorter than ~12 mm is a nub, not a claw. (The
                                    #   original wheels are r 0.0225 -- mountable only via
                                    #   their own small hubs, which a horn-seating printed
                                    #   hub replaces.)
  max_width: 0.070                  # m, free outboard (user decision); bounded by print
                                    #   time and proportion, not the robot
  min_width: 0.030                  # m
  wheel_well_radius: 0.095          # m. There is no enclosing well; nearest fixed structure
                                    #   is the side plate, and the belly rises with the
                                    #   wheel. Set just above max_radius so it cannot bind
                                    #   before the explicit max does.
  max_mass_fraction: 0.05           # per wheel, as fraction of chassis mass -> 0.365 kg at
                                    #   the measured 7.3. Was 0.15 when the robot was 4 kg,
                                    #   which would permit a 1.1 kg wheel -- not a limit.

operating_point:
  nominal_wheel_load: 20.6          # N. RE-DERIVED 2026-08-11 from the measured mass:
                                    #   (8.0 kg chassis + 4 x ~0.10 kg printed wheel)
                                    #   x 9.81 / 4 = 20.6. THIS IS THE CACHE-INVALIDATING
                                    #   COMMIT the old PENDING note promised; the FEA scale
                                    #   and LoadCase.nominal_load_n move with it. The
                                    #   buckling constraint asks 2.5x = 51.5 N.
  target_speed: 0.25                # m/s. Re-derived 2026-08-11 twice: the MX-64's no-load
                                    #   speed reaches 0.26 m/s on the smallest wheel (R 40)
                                    #   and 0.59 on the largest, so 0.25 is attainable by
                                    #   every design in the space -- the consistency check
                                    #   caught the first attempt (0.35) being unreachable
                                    #   at the small end
  payload_range: [0.0, 3.0]         # kg, additional payload

manufacturing:
  printer: bambulab-x1c            # 0.4 mm nozzle, direct-drive conversion
  bed_size: [0.250, 0.225, 0.250]   # m. Now also PlatformLimits.bed_size_mm.
  nozzle_diameter: 0.0004           # m
  extruder: direct-drive            # TPU requires direct-drive
  max_print_time_hours: 24          # a 200 mm TPU wheel is an overnight print
  max_material_grams: 450           # the nominal wheel is ~300 g; feasible designs at this
                                    #   load run 250-350 g. The old 200 g cap predates the
                                    #   larger robot and would reject every valid design.
  min_wall_thickness_tpu: 0.0016    # m
  min_wall_thickness_rigid: 0.0012  # m
  max_overhang_deg_tpu: 45
  max_overhang_deg_rigid: 50
  max_bridge_length_tpu: 0.015      # m
  min_interspoke_gap: 0.002         # m, nozzle traversal clearance

# REMAINING GAP, the structural one: this file is *meant* to be the single source of truth —
# src/wheelopt/cad/constraints.py says so in the PlatformLimits docstring — but nothing
# loads it, so PlatformLimits is authoritative in practice. Editing this file still changes
# nothing about what the pipeline does. The values now match by hand; a loader would make
# them match by construction. That is first-week step 1's actual content.

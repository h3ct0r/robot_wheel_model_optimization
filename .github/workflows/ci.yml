# CI: the unit suite, and the Phase 0 determinism gate run on a genuinely different machine.
#
# Two jobs on purpose. `tests` is the ordinary red/green signal. `determinism-gate` is an
# EXPERIMENT — `docs/plan/11-phases.md` asks for "identical θ → identical score on two
# machines", and this runner (Linux x86-64) against the reference manifests (macOS arm64,
# committed under tests/fixtures/ci/) is exactly that claim being tested.
#
# The gate's FIRST verdict arrived 2026-08-12, and the answer is: bit-identical is FALSE
# across platforms. Different libm/SIMD move contact-rich MuJoCo trajectories — measured
# drift ~1e-5 relative on positions, up to 3.6% on energy (the integral of slip friction
# through grinding stalls). Exactly the finding the experiment existed to produce; it is in
# the log of that date. The gate therefore runs with `--tolerance cross-machine`
# (store.CROSS_MACHINE_RTOL — the measured drift with ~5x headroom; verdicts, statuses and
# run identity stay exact). Same-machine gates remain bit-exact. If THIS job fails now, a
# platform disagrees beyond its measured drift, or a verdict flipped — either is a real
# finding again, not a flaky build.
#
# What deliberately does NOT run here: CalculiX, gmsh, OCCT. The FEA and CAD batteries need
# real kernels and a conda environment; the unit suite is designed to skip those layers
# cleanly, and the S1 gate needs only MuJoCo, which ships manylinux wheels. Keeping the
# heavy toolchain out is what keeps the whole workflow under the 5-minute budget the plan
# sets for it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (numpy layers + sim + store, no CAD/FEA kernels)
        run: pip install -e '.[sim,store,dev]'
      - name: Unit suite
        run: python -m unittest discover -s tests -t .
      - name: Lint
        run: ruff check .

  determinism-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[sim,store]'
      - name: "Cross-machine gate: 3 designs against the committed manifests"
        run: |
          # Radii spanning the ADOPTED envelope (R 40-90, 2026-08-11)
          for r in 45 65 85; do
            python scripts/run_s1.py --radius "$r" --heights 40:120:40 --seeds 4 \
              --no-store --manifest "tests/fixtures/ci/s1_R${r}.json" \
              --tolerance cross-machine
          done
